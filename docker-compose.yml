services:
  bootstrap:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        import os, pathlib, secrets
        root=pathlib.Path('/run/proxyforge')
        root.mkdir(parents=True,exist_ok=True)
        for name in ('admin_token','enrollment_token'):
            path=root/name
            existing=path.read_text().strip() if path.is_file() else ''
            if len(existing)<32:
                # Repair missing, empty or truncated credentials without deleting volumes.
                temp=root/(name+'.tmp')
                fd=os.open(temp,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
                with os.fdopen(fd,'w') as stream:
                    stream.write(secrets.token_urlsafe(48))
                os.replace(temp,path)
            os.chmod(path,0o600)
        print('ProxyForge credentials initialized. Retrieve Admin Token: docker compose exec api cat /run/proxyforge/admin_token',flush=True)
    volumes:
      - proxyforge_secrets:/run/proxyforge
    restart: "no"
  api:
    build:
      context: .
      args: {SERVICE: backend}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DB_PATH: /data/proxyforge.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      UI_ORIGIN: ${UI_ORIGIN:-*}
      AGENT_ALLOWED_URLS: ${AGENT_ALLOWED_URLS:-}
      ALLOW_HTTP_AGENTS: ${ALLOW_HTTP_AGENTS:-false}
    volumes:
      - proxyforge_data:/data
      - proxyforge_secrets:/run/proxyforge:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped
volumes:
  proxyforge_data:
  proxyforge_secrets:
networks:
  default:
    ipam:
      config:
        - subnet: 172.14.0.0/24
          gateway: 172.14.0.1
