<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProxyForge</title><style>body{background:#0f172a;color:#e2e8f0;font:15px system-ui;margin:0}header{background:#1e293b;padding:20px 5%;font-size:24px;font-weight:700}main{max-width:1050px;margin:32px auto;padding:0 18px}section{background:#1e293b;padding:22px;border-radius:14px;margin-bottom:20px}input,select,button{background:#334155;color:white;border:1px solid #475569;border-radius:7px;padding:10px;margin:5px}button{background:#2563eb;cursor:pointer}pre{white-space:pre-wrap;background:#020617;padding:18px;border-radius:8px}small{color:#94a3b8}#msg{color:#86efac}</style></head><body><header>⬡ ProxyForge <small>· Control Plane MVP</small></header><main><section><h3>Connection</h3><input id="api" value="http://localhost:8000" placeholder="API URL"><input id="token" type="password" placeholder="Admin token"><button onclick="load()">Connect</button><p id="msg"></p></section><section><h3>Add node</h3><input id="nodeName" placeholder="Node name"><select id="engine"><option>haproxy</option><option>nginx</option></select><input id="url" value="http://agent:8000" placeholder="Agent URL"><input id="agentToken" type="password" placeholder="Agent token"><button onclick="addNode()">Add node</button></section><section><h3>Nodes & upstreams</h3><select id="nodes" onchange="preview()"></select><div><input id="upName" placeholder="Backend name"><input id="host" placeholder="10.0.0.10"><input id="port" type="number" value="8080"><select id="algo"><option>roundrobin</option><option>leastconn</option></select><button onclick="addUpstream()">Add upstream</button></div><button onclick="preview()">Preview</button><button onclick="deploy()">Deploy (dry-run by default)</button><pre id="config">Select a node to preview.</pre></section></main><script>
const $=id=>document.getElementById(id);const val=id=>$(id).value;async function call(path,method='GET',body){const r=await fetch(val('api')+path,{method,headers:{'Content-Type':'application/json','X-Admin-Token':val('token')},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));return j}async function run(fn){try{$('msg').textContent='';await fn()}catch(e){$('msg').textContent=e.message}}async function load(){return run(async()=>{const nodes=await call('/nodes');$('nodes').replaceChildren(...nodes.map(n=>new Option(n.name+' ('+n.engine+')',n.id)));$('msg').textContent='Connected';if(nodes.length)await preview()})}async function addNode(){await run(async()=>{await call('/nodes','POST',{name:val('nodeName'),engine:val('engine'),url:val('url'),token:val('agentToken')});await load()})}async function addUpstream(){await run(async()=>{await call('/upstreams','POST',{node_id:Number(val('nodes')),name:val('upName'),host:val('host'),port:Number(val('port')),algorithm:val('algo')});await preview()})}async function preview(){if(!val('nodes'))return;await run(async()=>{$('config').textContent=(await call('/preview/'+val('nodes'))).config||'(empty)'})}async function deploy(){await run(async()=>{if(!confirm('Send configuration to agent?'))return;const result=await call('/deploy/'+val('nodes'),'POST');$('msg').textContent=JSON.stringify(result)})}
</script></body></html>
